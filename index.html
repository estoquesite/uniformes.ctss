<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#005a57">
<title>Uniformes Vale (v6)</title>
<link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Uniformes%20Vale%22%2C%22short_name%22%3A%22Uniformes%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23005a57%22%2C%22theme_color%22%3A%22%23005a57%22%7D">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E👕%3C/text%3E%3C/svg%3E">
<script src="https://cdn.tailwindcss.com"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#eef4f3;color:#1e293b;font-size:14px;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
#hd{position:sticky;top:0;z-index:30;background:linear-gradient(90deg,#007e7a,#005a57);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid #cfe3e1;padding-bottom:env(safe-area-inset-bottom)}
#nav>div{display:grid;max-width:640px;margin:0 auto}
#nav button{position:relative;padding:8px 2px;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700;color:#64808d;min-height:56px}
#nav button.on{color:#007e7a}#nav button span:first-child{font-size:20px}
.bd{position:absolute;top:4px;right:calc(50% - 22px);background:#f59e0b;color:#fff;border-radius:99px;font-size:10px;padding:0 5px;min-width:16px}
.card{background:#fff;border:1px solid #d5e5e3;border-radius:18px;padding:14px}
.b{background:#007e7a;color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;font-size:13px;min-height:44px}
.b:active{background:#005a57}.b2{background:#e2eceb;color:#1e293b}.b3{background:#fee2e2;color:#b91c1c}.b4{background:#d1fae5;color:#065f46}
.sm{min-height:36px;padding:6px 12px;font-size:12px}
.inp{width:100%;padding:10px 12px;border:1px solid #c3d4d2;border-radius:12px;background:#fff;font-size:16px;min-height:44px}
.inp:focus{outline:2px solid #007e7a;border-color:transparent}
.chip{padding:7px 16px;border-radius:99px;background:#fff;border:1px solid #d5e5e3;font-weight:700;font-size:12px;white-space:nowrap}
.chip.on{background:#007e7a;color:#fff;border-color:#007e7a}
.tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:8px;border:1px solid}
.Pendente{background:#fef3c7;color:#92400e;border-color:#fcd34d}.Aprovado{background:#d1fae5;color:#065f46;border-color:#6ee7b7}.Rejeitado{background:#fee2e2;color:#991b1b;border-color:#fca5a5}.Entregue{background:#dbeafe;color:#1e40af;border-color:#93c5fd}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#0f172a;color:#fff;font-weight:700;font-size:12px;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;z-index:70;background:rgba(15,23,42,.8);display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
#termo{display:none}
@media print{
 @page{size:A4 portrait;margin:8mm 10mm}
 body{background:#fff!important;padding:0!important}
 #hd,#nav,#view,#toast,#modal{display:none!important}
 #termo{display:block!important}
 #termo table{border-collapse:collapse;width:100%}
 #termo th,#termo td{border:1px solid #334155;padding:4px 6px;font-size:10px}
 #termo th{background:#007e7a!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header id="hd"></header>
<main id="view" class="max-w-3xl mx-auto p-3 space-y-3"></main>
<nav id="nav"></nav>
<div id="toast"></div>
<div id="modal"><div class="card w-full max-w-sm space-y-3" id="modal-c"></div></div>
<div id="termo"></div>

<script>
const K="mariana_uniformes_vale_dados_fixos_v3", KS="vale_sessao_v6", KC="vale_carrinho_v6", ADM="81025364";
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IMG1="https://cdn-icons-png.flaticon.com/512/3163/3163179.png";
const UNI=[
{id:1,nome:"Camisa administrativa masculina manga curta",cor:"Verde Vale / Cinza",referencia:"CM-443",categoria:"masculino",imagem:IMG1,tamanhos:["01","02","03","04","05","06","07","08","09","10","11","12","13"],codigos:{"01":"16724400","02":"16724412","03":"16724642","04":"16724406","05":"16724290","06":"16725084","07":"16724640","08":"16724679","09":"16724399","10":"16724357","11":"13300303","12":"13308561","13":"13329458"}},
{id:2,nome:"Camisa administrativa feminina manga curta",cor:"Verde Vale / Cinza",referencia:"CM-918",categoria:"feminino",imagem:IMG1,tamanhos:["36","38","40","42","44","46","48","50","52","54","56","58","60"],codigos:{"36":"16724419","38":"16724632","40":"15500269","42":"16724557","44":"16724179","46":"16724435","48":"16724631","50":"16724654","52":"15500271","54":"16724434","56":"13307872","58":"13307871","60":"13307870"}},
{id:3,nome:"Polo masculina (administrativa)",cor:"Cinza / Branco",referencia:"CM-540",categoria:"polo",imagem:"https://cdn-icons-png.flaticon.com/512/892/892458.png",tamanhos:["XP","P","M","G","GG","3G","4G","5G","6G"],codigos:{"XP":"13306603","P":"13306602","M":"13306601","G":"13306600","GG":"13306549","3G":"13306548","4G":"13306547","5G":"13306546","6G":"13306545"}},
{id:4,nome:"Calça jeans administrativo feminina",cor:"Azul Marinho",referencia:"CL-285",categoria:"calca",imagem:"https://cdn-icons-png.flaticon.com/512/2613/2613204.png",tamanhos:["34","36","38","40","42","44","46","48","50","52","54","56","58","60"],codigos:{"34":"13315330","36":"13315329","38":"13315328","40":"13315327","42":"13315326","44":"13315351","46":"13315350","48":"13315349","50":"13315348","52":"13315347","54":"13315346","56":"13315345","58":"13315300","60":"13314839"}}
];
let D={uniformes:UNI,pedidos:[],utilizadores:[]}, me=null, carrinho=[], tab='catalogo', cat='todos', q='', pf='todos', modoReg=false;
const FILTROS={masculino:/masculin/,feminino:/feminin/,calca:/cal[cç]a/,polo:/polo/};

/* ---------- util ---------- */
const adm=()=>!!(me&&(me.admin||me.matricula===ADM));
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){toast('Sem espaço para salvar (fotos muito grandes?)')}};
const saveC=()=>localStorage.setItem(KC,JSON.stringify(carrinho));
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('vale:'+s));return 'sha256:'+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return s}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2400)}
const brData=d=>d?d.split('-').reverse().join('/'):'';
const hoje=()=>new Date().toISOString().slice(0,10);

/* ---------- início ---------- */
(function(){
  try{const p=JSON.parse(localStorage.getItem(K)||'null');if(p){if(p.uniformes?.length)D.uniformes=p.uniformes;if(p.pedidos)D.pedidos=p.pedidos;if(p.utilizadores)D.utilizadores=p.utilizadores}}catch(e){}
  if(!D.utilizadores.some(u=>u.matricula===ADM))D.utilizadores.push({matricula:ADM,nome:"Mariana Pereira Cruz",senha:"1510",admin:true});
  try{carrinho=JSON.parse(localStorage.getItem(KC)||'[]')}catch(e){}
  const s=localStorage.getItem(KS)||sessionStorage.getItem('usuario_logado_vale');
  if(s){let m=s;try{m=JSON.parse(s).matricula||s}catch(e){}me=D.utilizadores.find(u=>u.matricula===m)||null}
  addEventListener('DOMContentLoaded',R);
  if(document.readyState!=='loading')R();
})();

/* ---------- render ---------- */
function tabs(){
  const n=carrinho.reduce((a,c)=>a+c.quantidade,0), pend=D.pedidos.filter(p=>p.status==='Pendente').length;
  const t=[['catalogo','👕','Catálogo',0],['carrinho','🛒','Carrinho',n],['pedidos','📋',adm()?'Pedidos':'Meus',adm()?pend:0]];
  if(adm())t.push(['itens','✏️','Itens',0],['usuarios','👥','Usuários',0]);
  return t;
}
function R(){hd();navR();view()}
function hd(){
  $('hd').innerHTML=`<div><div style="font-weight:900;letter-spacing:.15em;font-size:11px;color:#a7f3d0">VALE</div><div style="font-weight:800;font-size:15px">Uniformes & EPIs</div></div>
  <div class="flex items-center gap-2">${me?`<span style="font-size:12px;text-align:right;line-height:1.2"><b>${esc(me.nome.split(' ')[0])}</b><br><span style="opacity:.8">${esc(me.matricula)}${adm()?' · gestor':''}</span></span><button class="b sm" style="background:rgba(255,255,255,.18)" onclick="sair()">Sair</button>`:`<button class="b sm" style="background:#f59e0b" onclick="abrirLogin()">Entrar</button>`}</div>`;
}
function navR(){
  const t=tabs();
  $('nav').innerHTML=`<div style="grid-template-columns:repeat(${t.length},1fr)">${t.map(([id,i,l,n])=>`<button class="${tab===id?'on':''}" onclick="go('${id}')"><span>${i}</span><span>${l}</span>${n?`<i class="bd" style="font-style:normal">${n}</i>`:''}</button>`).join('')}</div>`;
}
function go(t){tab=t;R();scrollTo(0,0)}
function view(){
  if(!adm()&&(tab==='itens'||tab==='usuarios'))tab='catalogo';
  const v=$('view');
  ({catalogo:vCat,carrinho:vCar,pedidos:vPed,itens:vItens,usuarios:vUsers})[tab](v);
}

/* ---------- catálogo ---------- */
function vCat(v){
  v.innerHTML=`<input id="busca" class="inp" placeholder="🔍 Buscar por nome, ref ou código SAP" value="${esc(q)}" oninput="q=this.value;grid()">
  <div class="flex gap-2 overflow-x-auto pb-1">${[['todos','Todos'],['masculino','Masculino'],['feminino','Feminino'],['calca','Calças'],['polo','Polos']].map(([k,l])=>`<button class="chip ${cat===k?'on':''}" onclick="cat='${k}';R()">${l}</button>`).join('')}</div>
  <div id="grid" class="grid gap-3 sm:grid-cols-2"></div>`;
  grid();
}
function grid(){
  const f=q.toLowerCase().trim();
  const l=D.uniformes.filter(u=>{
    const txt=(u.nome+' '+(u.categoria||'')).toLowerCase();
    const okC=cat==='todos'||FILTROS[cat].test(txt);
    const okQ=!f||(u.nome+' '+u.referencia+' '+Object.values(u.codigos||{}).join(' ')).toLowerCase().includes(f);
    return okC&&okQ;
  });
  $('grid').innerHTML=l.length?l.map(u=>`<div class="card space-y-3">
   <div class="flex gap-3 items-center"><div style="width:64px;height:64px;background:#f1f5f9;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:6px;flex-shrink:0"><img src="${esc(u.imagem)}" alt="" style="max-width:100%;max-height:100%;object-fit:contain"></div>
    <div class="min-w-0"><span class="tag" style="color:#007e7a;border-color:#99d5d2;background:#e6f4f4">${esc(u.referencia)}</span><div style="font-weight:700;margin-top:4px">${esc(u.nome)}</div><div style="font-size:12px;color:#64748b">${esc(u.cor)}</div></div></div>
   <div class="flex gap-2"><select id="t${u.id}" class="inp" style="flex:1">${(u.tamanhos||[]).map(t=>`<option value="${esc(t)}">Tam ${esc(t)} · SAP ${esc((u.codigos||{})[t]||'---')}</option>`).join('')||'<option value="">Sem tamanhos</option>'}</select>
    <input id="q${u.id}" type="number" inputmode="numeric" min="1" max="20" value="1" class="inp" style="width:64px;text-align:center"></div>
   <button class="b w-full" onclick="addCar(${u.id})">🛒 Adicionar</button></div>`).join(''):'<p class="text-center text-slate-400 py-8">Nenhum uniforme encontrado.</p>';
}
function addCar(id){
  const u=D.uniformes.find(x=>x.id===id), t=$('t'+id).value;
  if(!t)return toast('Selecione um tamanho.');
  const qt=Math.max(1,Math.min(20,parseInt($('q'+id).value)||1)), ex=carrinho.find(c=>c.id===id&&c.tamanho===t);
  if(ex)ex.quantidade=Math.min(20,ex.quantidade+qt);
  else carrinho.push({cartId:Date.now()+Math.random(),id,nome:u.nome,cor:u.cor,referencia:u.referencia,tamanho:t,codigo:(u.codigos||{})[t]||'---',quantidade:qt});
  saveC();navR();toast(`${u.nome} (${t}) adicionado`);
}

/* ---------- carrinho ---------- */
function vCar(v){
  v.innerHTML=`<h2 style="font-weight:800;font-size:16px">🛒 Carrinho</h2>
  ${carrinho.length?carrinho.map((c,i)=>`<div class="card flex items-center gap-2"><div class="min-w-0 flex-1"><div style="font-weight:700">${esc(c.nome)}</div><div style="font-size:12px;color:#64748b">Tam <b>${esc(c.tamanho)}</b> · SAP <b>${esc(c.codigo)}</b></div></div>
   <div class="flex items-center gap-1"><button class="b b2 sm" onclick="qtd(${i},-1)">−</button><b style="min-width:22px;text-align:center">${c.quantidade}</b><button class="b b2 sm" onclick="qtd(${i},1)">+</button><button class="b b3 sm" onclick="carrinho.splice(${i},1);saveC();R()">✕</button></div></div>`).join(''):'<p class="text-center text-slate-400 py-8">Seu carrinho está vazio.</p>'}
  <div class="card space-y-3"><div style="font-weight:800">📝 Retirada no almoxarifado</div>
   ${me?`<div style="font-size:13px">Solicitante: <b>${esc(me.nome)}</b> · Matrícula <b>${esc(me.matricula)}</b></div>`:`<button class="b w-full" onclick="abrirLogin()">Entrar para enviar o pedido</button>`}
   <label style="font-size:12px;font-weight:700">Data desejada<input type="date" id="dt" class="inp" min="${hoje()}" value="${hoje()}"></label>
   <button class="b w-full" onclick="enviar()">🚀 Enviar pedido para aprovação</button></div>`;
}
function qtd(i,d){carrinho[i].quantidade=Math.max(1,Math.min(20,carrinho[i].quantidade+d));saveC();R()}
function enviar(){
  if(!me)return abrirLogin();
  if(!carrinho.length)return toast('Seu carrinho está vazio.');
  const d=$('dt').value; if(!d)return toast('Informe a data de retirada.');
  if(d<hoje())return toast('A data não pode ser no passado.');
  D.pedidos.unshift({id:Date.now(),matricula:me.matricula,nome:me.nome,dataRetirada:d,dataPedido:new Date().toLocaleDateString('pt-BR'),status:'Pendente',itens:carrinho.map(c=>({...c}))});
  carrinho=[];save();saveC();toast('🚀 Pedido enviado!');go('pedidos');
}

/* ---------- pedidos ---------- */
function vPed(v){
  if(!me){v.innerHTML='<div class="card text-center space-y-3"><p>Entre para ver seus pedidos.</p><button class="b" onclick="abrirLogin()">Entrar</button></div>';return}
  const base=adm()?D.pedidos:D.pedidos.filter(p=>p.matricula===me.matricula);
  const l=base.filter(p=>pf==='todos'||p.status===pf);
  v.innerHTML=`<div class="flex items-center justify-between gap-2"><h2 style="font-weight:800;font-size:16px">${adm()?'📊 Pedidos':'📋 Meus pedidos'}</h2>
   ${adm()?`<div class="flex gap-1.5"><button class="b b2 sm" onclick="csv()">📊 Excel</button><button class="b b3 sm" onclick="limparPed()">Limpar</button></div>`:''}</div>
  <div class="flex gap-2 overflow-x-auto pb-1">${['todos','Pendente','Aprovado','Entregue','Rejeitado'].map(s=>`<button class="chip ${pf===s?'on':''}" onclick="pf='${s}';R()">${s==='todos'?'Todos':s}</button>`).join('')}</div>
  ${l.length?l.map(p=>`<div class="card space-y-2"><div class="flex justify-between items-start gap-2"><div><b>${esc(p.nome)}</b><div style="font-size:12px;color:#64748b">Mat. ${esc(p.matricula)} · pedido em ${esc(p.dataPedido)}<br>Retirada: ${brData(p.dataRetirada)}</div></div><span class="tag ${esc(p.status)}">${esc(p.status)}</span></div>
   <ul style="background:#f1f5f9;border-radius:12px;padding:10px;font-size:12px;line-height:1.7">${p.itens.map(i=>`<li>• ${i.quantidade}x ${esc(i.nome)} — Tam <b>${esc(i.tamanho)}</b> · SAP <b>${esc(i.codigo)}</b></li>`).join('')}</ul>
   <div class="flex gap-2 flex-wrap">${adm()?(p.status==='Pendente'?`<button class="b b4 sm flex-1" onclick="status(${p.id},'Aprovado')">✓ Aprovar</button><button class="b b3 sm" onclick="status(${p.id},'Rejeitado')">✕ Rejeitar</button>`:'')+(p.status==='Aprovado'?`<button class="b sm flex-1" onclick="status(${p.id},'Entregue')">📦 Marcar entregue</button>`:'')+`<button class="b b2 sm" onclick="imprimir(${p.id})">🖨️ Cautela A4</button>`:(p.status==='Pendente'?`<button class="b b3 sm" onclick="cancelar(${p.id})">Cancelar pedido</button>`:'')}</div></div>`).join(''):'<p class="text-center text-slate-400 py-8">Nenhum pedido.</p>'}`;
}
function status(id,s){const p=D.pedidos.find(x=>x.id===id);if(p){p.status=s;save();R();toast('Pedido '+s.toLowerCase())}}
function cancelar(id){if(confirm('Cancelar este pedido?')){D.pedidos=D.pedidos.filter(p=>p.id!==id);save();R()}}
function limparPed(){if(confirm('Apagar TODOS os pedidos do histórico?')){D.pedidos=[];save();R()}}
function imprimir(id){
  const p=D.pedidos.find(x=>x.id===id);if(!p)return;
  $('termo').innerHTML=`<table style="margin-bottom:8px"><tr><td style="width:80px;text-align:center;font-weight:900;font-size:16px;color:#007e7a">VALE</td><td style="text-align:center;font-weight:800;text-transform:uppercase">Termo de entrega e cautela de uniformes e equipamentos</td><td style="width:130px;font-size:9px"><b>Nº Pedido:</b> ${p.id}<br><b>Data:</b> ${esc(p.dataPedido)}</td></tr></table>
  <div style="font-size:10px;border:1px solid #334155;padding:6px;margin-bottom:8px"><b>COLABORADOR:</b> ${esc(p.nome)} &nbsp;|&nbsp; <b>MATRÍCULA:</b> ${esc(p.matricula)} &nbsp;|&nbsp; <b>RETIRADA:</b> ${brData(p.dataRetirada)}</div>
  <table style="margin-bottom:14px"><thead><tr><th>ITEM</th><th style="text-align:left">DESCRIÇÃO</th><th>REF.</th><th>TAM.</th><th>CÓDIGO SAP</th><th>QTD</th></tr></thead><tbody>${p.itens.map((i,n)=>`<tr><td align="center">${n+1}</td><td><b>${esc(i.nome)}</b></td><td align="center">${esc(i.referencia)}</td><td align="center"><b>${esc(i.tamanho)}</b></td><td align="center">${esc(i.codigo)}</td><td align="center"><b>${i.quantidade}</b></td></tr>`).join('')}</tbody></table>
  <div style="font-size:9px;border:1px dashed #94a3b8;padding:6px;margin-bottom:34px">Declaro ter recebido da VALE S.A., a título de cautela, os uniformes e/ou EPIs acima discriminados, em perfeitas condições de uso, comprometendo-me a zelar pela sua conservação e a utilizá-los estritamente no exercício de minhas atividades profissionais.</div>
  <div style="display:flex;justify-content:space-between;font-size:10px;text-align:center"><div style="width:250px;border-top:1px solid #000;padding-top:4px">Assinatura do Colaborador<br><small>(Recebedor)</small></div><div style="width:250px;border-top:1px solid #000;padding-top:4px">Almoxarifado / Suprimentos<br><small>(Responsável pela Entrega)</small></div></div>`;
  print();
}
function csv(){
  if(!D.pedidos.length)return toast('Nenhum pedido para exportar.');
  const c=s=>`"${String(s).replace(/"/g,'""')}"`;
  let t="ID Pedido;Data Pedido;Matricula;Nome;Data Retirada;Status;Peca;Tamanho;Codigo SAP;Quantidade\n";
  D.pedidos.forEach(p=>p.itens.forEach(i=>t+=[p.id,p.dataPedido,p.matricula,p.nome,p.dataRetirada,p.status,i.nome,i.tamanho,i.codigo,i.quantidade].map(c).join(';')+'\n'));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv;charset=utf-8'}));a.download=`pedidos_uniformes_vale_${hoje()}.csv`;a.click();toast('Planilha exportada');
}

/* ---------- itens (admin) ---------- */
function vItens(v){
  v.innerHTML=`<div class="flex items-center justify-between"><h2 style="font-weight:800;font-size:16px">✏️ Itens do catálogo</h2><button class="b sm" onclick="novoItem()">➕ Nova peça</button></div>
  ${D.uniformes.map(u=>`<details class="card"><summary class="flex items-center gap-3"><img src="${esc(u.imagem)}" alt="" style="width:40px;height:40px;object-fit:contain;background:#f1f5f9;border-radius:10px"><div class="min-w-0 flex-1"><b class="block truncate">${esc(u.nome)}</b><span style="font-size:12px;color:#64748b">${esc(u.referencia)} · ${(u.tamanhos||[]).length} tamanhos</span></div><span>▾</span></summary>
   <div class="space-y-2 pt-3">
    <input class="inp" value="${esc(u.nome)}" onchange="setU(${u.id},'nome',this.value)" placeholder="Descrição">
    <div class="grid grid-cols-2 gap-2"><input class="inp" value="${esc(u.referencia)}" onchange="setU(${u.id},'referencia',this.value)" placeholder="Ref."><input class="inp" value="${esc(u.cor)}" onchange="setU(${u.id},'cor',this.value)" placeholder="Cor"></div>
    <select class="inp" onchange="setU(${u.id},'categoria',this.value)">${[['masculino','Masculino'],['feminino','Feminino'],['calca','Calça'],['polo','Polo'],['geral','Geral']].map(([k,l])=>`<option value="${k}" ${u.categoria===k?'selected':''}>${l}</option>`).join('')}</select>
    <label style="font-size:12px;font-weight:700">Foto<input type="file" accept="image/*" class="inp" onchange="foto(${u.id},event)"></label>
    <div style="font-weight:700;font-size:12px">📏 Tamanhos e códigos SAP</div>
    ${(u.tamanhos||[]).map((t,i)=>`<div class="flex gap-2"><input class="inp" style="width:84px;text-align:center" value="${esc(t)}" onchange="setTam(${u.id},${i},this.value)"><input class="inp" inputmode="numeric" value="${esc((u.codigos||{})[t]||'')}" onchange="setCod(${u.id},${i},this.value)" placeholder="Cód. SAP"><button class="b b3 sm" onclick="delTam(${u.id},${i})">✕</button></div>`).join('')}
    <div class="flex gap-2"><button class="b b2 sm flex-1" onclick="addTam(${u.id})">➕ Tamanho</button><button class="b b3 sm" onclick="delItem(${u.id})">Excluir peça</button></div></div></details>`).join('')}`;
}
const U=id=>D.uniformes.find(x=>x.id===id);
function setU(id,k,v){U(id)[k]=v.trim();save();toast('Salvo')}
function novoItem(){D.uniformes.unshift({id:Date.now(),nome:"Nova peça",cor:"Verde Vale / Cinza",referencia:"REF-000",categoria:"geral",imagem:IMG1,tamanhos:["P","M","G"],codigos:{P:"",M:"",G:""}});save();R()}
function delItem(id){if(confirm('Excluir esta peça do catálogo?')){D.uniformes=D.uniformes.filter(x=>x.id!==id);save();R()}}
function addTam(id){const u=U(id);let n=u.tamanhos.length+1,t='TAM'+n;u.tamanhos.push(t);(u.codigos=u.codigos||{})[t]='';save();R()}
function setTam(id,i,v){const u=U(id),o=u.tamanhos[i],n=v.trim().toUpperCase();if(!n||u.tamanhos.includes(n))return R();u.tamanhos[i]=n;u.codigos[n]=u.codigos[o]||'';delete u.codigos[o];save();R()}
function setCod(id,i,v){const u=U(id);u.codigos[u.tamanhos[i]]=v.trim();save();toast('Salvo')}
function delTam(id,i){const u=U(id);delete u.codigos[u.tamanhos[i]];u.tamanhos.splice(i,1);save();R()}
function foto(id,e){ // reduz a foto para caber no armazenamento
  const f=e.target.files[0];if(!f)return;
  const im=new Image();im.onload=()=>{const s=Math.min(1,400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);U(id).imagem=c.toDataURL('image/jpeg',.8);save();R();toast('Foto atualizada')};
  im.src=URL.createObjectURL(f);
}

/* ---------- usuários (admin) ---------- */
function vUsers(v){
  v.innerHTML=`<h2 style="font-weight:800;font-size:16px">👥 Usuários (${D.utilizadores.length})</h2>
  <div class="card space-y-2"><div style="font-weight:700">Cadastrar colaborador</div><input id="nm" class="inp" inputmode="numeric" placeholder="Matrícula"><input id="nn" class="inp" placeholder="Nome completo"><input id="ns" class="inp" type="password" placeholder="Senha inicial"><button class="b w-full" onclick="novoUser()">✓ Salvar usuário</button></div>
  ${D.utilizadores.map((u,i)=>`<div class="card flex items-center gap-2"><div class="min-w-0 flex-1"><b>${esc(u.nome)}</b><div style="font-size:12px;color:#64748b">Mat. ${esc(u.matricula)}${u.admin||u.matricula===ADM?' · gestor':''}</div></div>
   ${u.matricula!==ADM?`<button class="b b2 sm" onclick="toggleAdm(${i})">${u.admin?'Tirar gestor':'Tornar gestor'}</button>`:''}${u.matricula!==me.matricula?`<button class="b b3 sm" onclick="delUser(${i})">✕</button>`:''}</div>`).join('')}`;
}
async function novoUser(){
  const m=$('nm').value.trim(),n=$('nn').value.trim(),s=$('ns').value.trim();
  if(!m||!n||!s)return toast('Preencha todos os campos.');
  if(D.utilizadores.some(u=>u.matricula===m))return toast('Matrícula já cadastrada.');
  D.utilizadores.push({matricula:m,nome:n,senha:await hash(s)});save();R();toast('Usuário cadastrado');
}
function toggleAdm(i){D.utilizadores[i].admin=!D.utilizadores[i].admin;save();R()}
function delUser(i){if(confirm('Remover este usuário?')){D.utilizadores.splice(i,1);save();R()}}

/* ---------- login ---------- */
function abrirLogin(){
  $('modal-c').innerHTML=`<div class="flex justify-between items-center"><b style="font-size:16px">${modoReg?'Criar conta':'Entrar'}</b><button onclick="fechar()" style="font-size:20px;padding:4px 8px">✕</button></div>
  <input id="am" class="inp" inputmode="numeric" placeholder="Matrícula">${modoReg?'<input id="an" class="inp" placeholder="Nome completo">':''}<input id="as" class="inp" type="password" placeholder="Senha" onkeydown="if(event.key==='Enter')auth()">
  <div id="ae" class="hidden" style="color:#e11d48;font-weight:700;font-size:12px"></div>
  <button class="b w-full" onclick="auth()">${modoReg?'Criar minha conta':'Entrar'}</button>
  <button class="w-full" style="color:#007e7a;font-weight:700;font-size:12px;padding:8px" onclick="modoReg=!modoReg;abrirLogin()">${modoReg?'Já tenho conta — entrar':'Primeiro acesso? Criar conta'}</button>`;
  $('modal').classList.add('on');
}
const fechar=()=>$('modal').classList.remove('on');
async function auth(){
  const m=$('am').value.trim(),s=$('as').value.trim(),e=$('ae');
  const erro=t=>{e.textContent=t;e.classList.remove('hidden')};
  if(!m||!s)return erro('Preencha matrícula e senha.');
  if(modoReg){
    const n=$('an').value.trim();if(!n)return erro('Digite seu nome completo.');
    if(D.utilizadores.some(u=>u.matricula===m))return erro('Esta matrícula já tem cadastro. Faça login.');
    D.utilizadores.push({matricula:m,nome:n,senha:await hash(s)});save();modoReg=false;toast('Conta criada! Entre agora.');return abrirLogin();
  }
  const u=D.utilizadores.find(x=>x.matricula===m),h=await hash(s);
  if(!u||(u.senha!==s&&u.senha!==h))return erro('Matrícula ou senha incorretas.');
  if(u.senha===s&&h!==s){u.senha=h;save()} // migra senha antiga para hash
  me=u;localStorage.setItem(KS,u.matricula);fechar();tab=adm()?'pedidos':tab;R();toast(`Bem-vindo(a), ${u.nome.split(' ')[0]}!`);
}
function sair(){me=null;localStorage.removeItem(KS);sessionStorage.removeItem('usuario_logado_vale');tab='catalogo';R();toast('Sessão encerrada')}
</script>
</body>
