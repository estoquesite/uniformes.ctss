<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro Simplificado</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      color: #333;
    }

    /* Seção de Filtros Tradicionais */
    .filtros-container {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      padding: 15px;
      background-color: #f5f5f5;
      border-radius: 6px;
    }
    .filtro-item {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .filtro-item select {
      padding: 8px;
      min-width: 180px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    /* Seção de Criação Direta de Categoria */
    .secao-cadastro {
      margin-bottom: 25px;
    }
    .input-inline {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    .input-inline input {
      padding: 8px 12px;
      width: 280px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .btn-ok {
      padding: 8px 18px;
      background-color: #0b7285;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Linhas Diretas de Tamanho + Código */
    .linha-tamanho {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .linha-tamanho input {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .input-tamanho {
      width: 120px;
    }
    .input-codigo {
      width: 180px;
    }

    /* Botões de Ação */
    .btn-adicionar {
      background-color: #2b8a3e;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 5px;
    }
    .btn-remover {
      background-color: #e03131;
      color: white;
      border: none;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- 1. Filtros Tradicionais (Sem os cards) -->
  <section class="filtros-container">
    <div class="filtro-item">
      <label for="filtro-categoria">Categoria / Classe:</label>
      <select id="filtro-categoria">
        <option value="">Todas as categorias</option>
        <option value="adm_masc">Administrativo Masculino</option>
        <option value="op_masc">Operacional Masculino</option>
      </select>
    </div>
    <div class="filtro-item">
      <label for="filtro-tamanho">Tamanho:</label>
      <select id="filtro-tamanho">
        <option value="">Todos os tamanhos</option>
        <option value="P">P</option>
        <option value="M">M</option>
        <option value="G">G</option>
      </select>
    </div>
  </section>

  <!-- 2. Cadastro de Categoria (Digitar + Enter/OK) -->
  <section class="secao-cadastro">
    <label for="nova-categoria"><strong>Nova Categoria:</strong></label>
    <div class="input-inline">
      <input type="text" id="nova-categoria" placeholder="Ex: Administrativo Masculino">
      <button class="btn-ok" id="btn-salvar-categoria">OK</button>
    </div>
  </section>

  <hr>

  <!-- 3. Tamanho e Código direto na mesma linha -->
  <section class="secao-cadastro">
    <h3>Tamanhos e Códigos</h3>
    <div id="container-tamanhos">
      <div class="linha-tamanho">
        <input type="text" class="input-tamanho" placeholder="Tamanho (ex: M)">
        <input type="text" class="input-codigo" placeholder="Código">
        <button class="btn-remover" onclick="removerLinha(this)">×</button>
      </div>
    </div>
    <button class="btn-adicionar" id="btn-adicionar-tamanho">+ Adicionar Tamanho</button>
  </section>

  <script>
    // Adicionar nova categoria ao pressionar Enter ou clicar em OK
    const inputCategoria = document.getElementById('nova-categoria');
    const btnSalvarCategoria = document.getElementById('btn-salvar-categoria');
    const selectCategoria = document.getElementById('filtro-categoria');

    function salvarCategoria() {
      const nome = inputCategoria.value.trim();
      if (!nome) return;

      const novaOpcao = document.createElement('option');
      novaOpcao.value = nome.toLowerCase().replace(/\s+/g, '_');
      novaOpcao.textContent = nome;
      selectCategoria.appendChild(novaOpcao);

      inputCategoria.value = '';
    }

    btnSalvarCategoria.addEventListener('click', salvarCategoria);
    inputCategoria.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        salvarCategoria();
      }
    });

    // Adicionar linha direta de Tamanho + Código
    const containerTamanhos = document.getElementById('container-tamanhos');
    const btnAdicionarTamanho = document.getElementById('btn-adicionar-tamanho');

    btnAdicionarTamanho.addEventListener('click', () => {
      const divLinha = document.createElement('div');
      divLinha.className = 'linha-tamanho';
      divLinha.innerHTML = `
        <input type="text" class="input-tamanho" placeholder="Tamanho">
        <input type="text" class="input-codigo" placeholder="Código">
        <button class="btn-remover" onclick="removerLinha(this)">×</button>
      `;
      containerTamanhos.appendChild(divLinha);
    });

    function removerLinha(botao) {
      botao.parentElement.remove();
    }
  </script>
</body>
</html>
